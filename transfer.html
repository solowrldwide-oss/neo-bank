<!DOCTYPE html>
<html>
<head>
    <title>Transfer Funds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <h2>Transfer Money</h2>

    <input
        type="text"
        id="account"
        placeholder="Recipient Account Number"
        oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10); generateTransferName(); generateBank();"
    >

    <input
        type="text"
        id="name"
        placeholder="Recipient Name"
    >

    <input
        type="text"
        id="bank"
        placeholder="Bank Name"
    >
<img id="bankLogo" class="bank-logo-img" />
    
    <input
        type="text"
        id="amount"
        placeholder="Amount"
        oninput="this.value=this.value.replace(/[^0-9]/g,'')"
    >

    <input
        type="password"
        id="pin"
        placeholder="4-digit PIN"
        maxlength="4"
        oninput="this.value=this.value.replace(/[^0-9]/g,'')"
    >
<small style="color:gray;">
    Default PIN: 1234
</small>
    
    <button onclick="makeTransfer()">Send Money</button>

    <p id="message"></p>

</div>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p>Processing Transfer...</p>
</div>

  <div id="reviewPopup" class="modal">
  <div class="modal-content">
    <h3>Review Transfer</h3>

    <p id="reviewDetails"></p>

    <button onclick="closeReview()">Cancel</button>
    <button onclick="startProcessing()">Confirm Transfer</button>
  </div>
</div>

    <div id="statusPopup" class="modal">
  <div class="modal-content">
    <h3 id="statusTitle">Processing...</h3>

    <p id="statusText">Please wait while we verify your transfer</p>

    <div class="spinner"></div>
  </div>
</div>

    
<script src="script.js"></script>

</body>
</html>
