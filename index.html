<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo Bank</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      width: 100%;
      padding: 20px;
    }

    .login-box {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }

    input {
      padding: 12px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Neo Bank</h1>
    <p>Website under construction</p>

    <div class="login-box">
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button>Sign In</button>
    </div>
  </div>

</body>
</html>
